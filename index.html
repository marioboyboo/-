<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinner Outcome Control</title>
  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #e63946;
      --accent-hover: #d62828;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    h2 { font-size: 1.4rem; font-weight: 800; }

    .status {
      font-size: 0.85rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }

    label { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); }

    select, button {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      border-radius: 10px;
      font-family: inherit;
      outline: none;
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="card">
    <h2>Spinner Controller</h2>
    <div class="status" id="status">Connecting...</div>

    <div>
      <label for="forceWinner">Next Forced Winner:</label>
      <select id="forceWinner" onchange="sendOverride()" style="margin-top: 8px;">
        <option value="">-- Fair / Random (No Rig) --</option>
      </select>
    </div>

    <button onclick="triggerRemoteSpin()">TRIGGER SPIN FROM HERE</button>
  </div>

  <script>
    const drone = new Scaledrone('RVMkQYQI2jHh2S2q');
    let room;

    drone.on('open', error => {
      if (error) return console.error(error);
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = '● Connected to Wheel';
      
      room = drone.subscribe('observable-spinner');

      // Request the current names list from the main wheel on startup
      drone.publish({
        room: 'observable-spinner',
        message: { type: 'REQUEST_NAMES' }
      });

      room.on('data', message => {
        if (message.type === 'SYNC_NAMES') {
          updateDropdown(message.names);
        } else if (message.type === 'SPIN_FINISHED') {
          // Reset the dropdown back to default once the spin completes
          resetSelection();
        }
      });
    });

    function updateDropdown(names) {
      const select = document.getElementById('forceWinner');
      const currentValue = select.value;
      
      select.innerHTML = '<option value="">-- Fair / Random (No Rig) --</option>';
      
      names.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      
      select.value = currentValue;
    }

    function sendOverride() {
      const forcedWinner = document.getElementById('forceWinner').value;
      drone.publish({
        room: 'observable-spinner',
        message: { type: 'SET_OVERRIDE', forcedWinner: forcedWinner || null }
      });
    }

    function resetSelection() {
      const select = document.getElementById('forceWinner');
      select.value = "";
      sendOverride(); // Clear any pending override on the server/wheel side
    }

    function triggerRemoteSpin() {
      drone.publish({
        room: 'observable-spinner',
        message: { type: 'TRIGGER_SPIN' }
      });
    }
  </script>
</body>
</html>
